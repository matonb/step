---
# The step CLI, for a host that talks to a CA rather than runs one. A CA host
# does not need this role: ca_server installs the CLI itself, because
# matonb.step.initialize shells out to `step ca init`.
step_cli_version: "0.30.6"

# Upstream release assets, built from the version above and this host's
# architecture. Replace the whole list to install from an internal mirror or
# from your distribution instead.
step_cli_packages: "{{ step_cli_package_urls }}"

# RedHat only. Upstream signs its RPMs, but does not publish the signing key
# anywhere importable, so installing the default URLs above means accepting an
# unverifiable signature.
#
# This is not hardcoded on the task, because step_cli_packages is meant to be
# repointed: someone installing from their own signed repository would
# otherwise have verification silently switched off for them. Set it false
# whenever the packages come from somewhere with a key you trust.
step_cli_disable_gpg_check: true
