---
# Role-internal. Override the variables in defaults/main.yml instead.
#
# Nothing about the smallstep repository lives here any more - step_cli owns
# it, and this role depends on step_cli. That is what stopped the two of them
# rewriting each other's repository file on every run.

# step_cli_version_separator rather than a copy of it. How a package manager
# spells a version pin - apt name=version, dnf name-version - is one fact, and
# it was written out in both roles, so getting it the wrong way round here
# would have gone unnoticed: nothing pins ca_server_ca_version, so the
# duplicate never rendered. It is in scope because step_cli is a dependency.
ca_server_package_names:
  - >-
    step-ca{{ (step_cli_version_separator ~ ca_server_ca_version)
    if ca_server_ca_version else '' }}

# Debian only, and that asymmetry is the point rather than an omission.
#
# The role and the unit file shell out to two things a minimal host may not
# have: getcap and setcap, without which community.general.capabilities fails
# outright, and /bin/kill, which unit.j2's ExecReload uses to send SIGHUP and
# without which `systemctl reload` fails with status=203/EXEC. Both were found
# by running the role against a container rather than by reading anything.
#
# Debian splits the capability tooling out of the library - systemd pulls
# libcap2, not libcap2-bin - and procps is not a systemd dependency either, so
# both have to be asked for.
#
# EL does not split either one. `rpm -qR systemd` requires libcap.so.2, which
# only the libcap package provides and which also owns /usr/sbin/getcap; and it
# requires util-linux, which pulls util-linux-core, which owns /usr/bin/kill.
# On a host running systemd - the only kind this role targets - both are
# already there, so naming them would be a task that can never do anything.
ca_server_support_packages:
  - libcap2-bin
  - procps
