---
# The smallstep repository is already configured: step_cli is a dependency of
# this role and owns it, along with the step CLI itself. See meta/main.yml.

# Its own task, and deliberately not skipped under --check. The apt module
# guards cache.update() behind check_mode, so on a host whose package lists
# were never populated - any container image, among others - a --check run
# cannot find libcap2-bin and fails at the first task of the role. Refreshing
# reads from the network and changes no package state, so doing it for real
# under --check is honest.
#
# No cache_valid_time, deliberately. It is judged from the mtime of
# /var/lib/apt/lists, which a freshly built image has - empty, but recent - so
# the courtesy of not refreshing turns into never refreshing on exactly the
# hosts that need it. The suite catches this if it is added back.
- name: Refresh the apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
  check_mode: false
  changed_when: false

- name: Install the tooling the role and unit file need
  become: true
  ansible.builtin.apt:
    name: "{{ ca_server_support_packages }}"
    state: present

- name: Check whether the smallstep repository is configured
  become: true
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/smallstep.list
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: ca_server_repository_stat

# Under --check on a host that has never run this role, step_cli's repository
# tasks wrote nothing either, so apt has no step-ca to report on and the
# install would fail outright rather than say what it would do. Same shape as
# the unit-file gate in main.yml, and the same as step_cli's own install gate -
# which it has to be. Somebody managing the repository themselves has one that
# this file cannot find, and without the middle clause --check would answer
# their play twice over: step_cli reporting on the CLI, this reporting nothing
# at all about step-ca. "Nothing to do" for a package that is absent is a wrong
# answer, not a cautious one.
#
# step_cli_manage_repository is in scope because step_cli is a dependency, and
# Role.get_default_vars merges a dependency's defaults into the dependent
# role's scope.
- name: Install step-ca
  become: true
  ansible.builtin.apt:
    name: "{{ ca_server_packages }}"
    state: present
  when: >-
    not ansible_check_mode
    or not step_cli_manage_repository | bool
    or ca_server_repository_stat.stat.exists | default(false)
