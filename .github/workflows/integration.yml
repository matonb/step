---
name: Integration

# Neither suite runs on every pull request. Both take minutes rather than
# seconds, both need Docker, and both reach smallstep's CDN - so on every PR
# they would make merging anything depend on a third party being up, and the
# failures people learn to ignore are the ones that fail for reasons unrelated
# to the change.
#
# So they run on the pull requests that can actually break them: those touching
# the modules, the roles, or the suites themselves. That replaced an opt-in
# `integration` label, which put the decision on whoever opened the pull request
# and so was missed exactly when it mattered. Anything outside these paths can
# still be run by hand from the Actions tab.
#
# Nothing here is a *merge* gate. A failure on a pull request is something to
# read. It is a *release* gate: release.yml calls this workflow, and a failure
# there stops the version being tagged, so nothing reaches Galaxy that these
# suites have not run against. That does couple releasing to smallstep's CDN
# being up, which is the price of not publishing something untested - and the
# paths below are what keep the release run from being the first time these
# suites see the code, which would find the problem a merge too late.
"on":
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - plugins/**
      - roles/**
      - tests/integration/**

# Read-only, and stated rather than inherited. Called from release.yml these
# jobs would otherwise take its `contents: write` - and actions/checkout leaves
# that token in .git/config in the workspace while role.sh runs privileged
# containers and both jobs install third-party artifacts from smallstep's apt
# repository and from Galaxy. Neither job writes anything to this repository.
permissions:
  contents: read

env:
  ANSIBLE_CORE_VERSION: "2.20.5"
  PYTHON_VERSION: "3.13"

jobs:
  # Two jobs rather than one script after another: a role.sh failure must not
  # bury a run.sh result, and either can be re-run on its own.
  modules:
    name: Modules against a real step-ca
    # Same pin as the sanity job, so the container behaviour these exercise is
    # not also drifting with the runner image.
    runs-on: ubuntu-24.04
    steps:
      # ansible-test is not used here, but role.sh and run.sh resolve the
      # collection as matonb.smallstep, so the checkout still has to sit at
      # that path.
      - name: Checkout into a collection path
        uses: actions/checkout@v7
        with:
          path: ansible_collections/matonb/smallstep

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${ANSIBLE_CORE_VERSION}"

      # run.sh drives the step CLI on the runner itself, not only in the
      # container, so it has to be installed here. From smallstep's own
      # repository, which is what the collection installs from.
      - name: Install the step CLI
        env:
          KEY_URL: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
          KEYRING: /etc/apt/keyrings/smallstep.asc
          REPO_URL: https://packages.smallstep.com/stable/debian
        run: |
          curl -fsSL "$KEY_URL" | sudo tee "$KEYRING" >/dev/null
          echo "deb [signed-by=$KEYRING] $REPO_URL debs main" \
            | sudo tee /etc/apt/sources.list.d/smallstep.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y step-cli
          step version

      - name: Run the module suite
        working-directory: ansible_collections/matonb/smallstep
        run: bash tests/integration/run.sh

  roles:
    name: Roles against real systemd
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout into a collection path
        uses: actions/checkout@v7
        with:
          path: ansible_collections/matonb/smallstep

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${ANSIBLE_CORE_VERSION}"

      # Two collections, for two different reasons. role.sh talks to its
      # containers through community.docker's connection plugin rather than
      # SSH, and checks for it before doing anything. community.general is the
      # ca_server role's own dependency - it uses the capabilities module to
      # grant CAP_NET_BIND_SERVICE - and without it the play fails at that
      # task rather than up front.
      - name: Install the collections the suite and the roles need
        run: |
          ansible-galaxy collection install community.docker
          ansible-galaxy collection install community.general

      # Twelve scenarios across two OS families, in containers with a real
      # PID 1 systemd. Around seven minutes.
      - name: Run the role suite
        working-directory: ansible_collections/matonb/smallstep
        run: bash tests/integration/role.sh
