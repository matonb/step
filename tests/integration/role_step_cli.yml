---
# step_cli owns the smallstep repository and the CLI; ca_server depends on it.
# This drives it on its own, which is how a client host uses it.
- name: Apply the step_cli role
  hosts: step_role
  gather_facts: true

  roles:
    - matonb.step.step_cli

  tasks:
    - name: The step CLI is on PATH and runs
      ansible.builtin.command: step version
      changed_when: false
      register: step_role_cli_version

    - name: It is smallstep's CLI
      ansible.builtin.assert:
        that:
          - "'Smallstep CLI/' in step_role_cli_version.stdout"
        fail_msg: >-
          `step version` did not report a Smallstep CLI:
          {{ step_role_cli_version.stdout }}

    # Asked of the package manager rather than inferred from a file existing.
    # The previous version of this checked that a repository file was on disk,
    # which would have passed just as well had the role configured the
    # repository and then installed the package from somewhere else entirely.
    - name: Ask the package manager where the CLI came from
      become: true
      ansible.builtin.shell:
        cmd: >-
          {{ "apt-cache policy step-cli"
             if ansible_facts['os_family'] == 'Debian'
             else "dnf repoquery --installed --qf '%{from_repo}' step-cli" }}
      changed_when: false
      register: step_role_origin

    - name: It was installed from smallstep's repository
      ansible.builtin.assert:
        that:
          - >-
            ('packages.smallstep.com' in step_role_origin.stdout)
            if ansible_facts['os_family'] == 'Debian'
            else ('smallstep' in step_role_origin.stdout)
        fail_msg: >-
          step-cli did not come from the smallstep repository:
          {{ step_role_origin.stdout }}
