[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [{ name = "Brett Maton", email = "brett@example.com" }]
description = "Ansible collection for managing Smallstep Certificate Authority"
dynamic = ["version"]
license = { text = "GPL-3.0-or-later" }
name = "matonb.step"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.4",
    "yamllint>=1.35.0",
    # ansible-core is deliberately absent: it arrives transitively through
    # ansible-lint, and a bound here would be a second number free to drift out
    # of step with requires_ansible in meta/runtime.yml, which is where the
    # supported floor is declared. Nor would a bound here hold that floor in
    # practice - current ansible-lint requires ansible-core >= 2.16, above the
    # 2.14 the collection supports. Testing at the floor means installing
    # ansible-core directly, which is what .github/workflows/test.yml does.
    "ansible-lint>=24.12.0",
]

[tool.ruff]
line-length = 122       # Match your existing flake8 setting
target-version = "py39"

[tool.ruff.lint]
ignore = [
    # Formatter conflicts
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)

    # Ansible module specific allowances
    "S101", # Use of assert
    "S603", # subprocess call - needed for Ansible modules
    "S607", # subprocess call with shell - sometimes needed

    # Type annotations (can be enabled gradually)
    "ANN", # Skip all type annotations for now

    # Complexity allowances for existing code
    "PLR0913", # Too many arguments to function call

    # Code style preferences
    "FBT002", # Allow boolean default arguments (common in CLI tools)
    "TID252", # Allow relative imports in packages

    # Exception handling style
    "BLE001", # Allow broad exception catching
    "TRY003", # Allow long exception messages
    "TRY300", # Allow statements not in else blocks

    # Performance patterns common in this codebase
    "PERF203", # Allow try-except in loops
    "PERF401", # Allow manual list building over comprehensions

    # Return patterns
    "RET504", # Allow assignment before return

    # Boolean argument patterns
    "FBT001", # Allow boolean positional arguments

    # Docstring allowances
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D105", # missing docstring in magic method

    # Ansible module specific patterns
    "ARG002",  # unused argument (interface compliance in abstract methods)
    "EM101",   # string literal in exception (common in error messages)
    "EM102",   # f-string in exception (common in error messages)
    "INP001",  # implicit namespace package (Ansible collection structure)
    "PLW1509", # preexec_fn with subprocess (needed for user switching)
    "PTH",     # pathlib usage (os.path is still common in system tools)
    "RUF010",  # explicit str() conversion (prefer explicit over implicit)
    "SIM105",  # contextlib.suppress (prefer explicit try/except for clarity)
]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PGH",  # pygrep-hooks
    "PL",   # pylint (PLC, PLE, PLR, PLW)
    "TRY",  # tryceratops
    "FLY",  # flynt
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"plugins/module_utils/*.py" = [
    "D101", # missing docstring in public class (some utility classes)
]
"plugins/modules/*.py" = [
    "D103",    # missing docstring in public function (main functions)
    "E402",    # module level import not at top of file
    #          Ansible's validate-modules requires DOCUMENTATION/EXAMPLES/RETURN
    #          to appear before any import, which is the opposite of E402.
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]
"tests/**/*.py" = [
    "D101",    # missing docstring in public class (test doubles)
    "D102",    # missing docstring in public method (test names are the docs)
    "PLR2004", # magic value in comparison
    #          Comparing against a literal expected value is the point of a
    #          test; naming each one would obscure what is being asserted.
    "S105",    # hardcoded password (test fixtures use obvious fake values)
    "S106",    # hardcoded password argument
    "SLF001",  # private member access (tests assert on the flag tables)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Mirrors the "unwanted functions" that ansible-test's pylint plugin rejects
# (ansible_test/.../pylint/plugins/unwanted.py), so ruff catches them locally
# rather than leaving them to CI. `print` is covered by T201 and
# `tempfile.mktemp` by S306, both of which are enabled above.
"sys.exit".msg = "Use module.exit_json() or module.fail_json() so Ansible receives a result."

[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections.matonb.step"]

[tool.semantic_release]
build_command = ""
tag_format = "v{version}"
version_variables = ["galaxy.yml:version"]

# No template_dir, deliberately. A templates/ directory holding any changelog
# template sends python-semantic-release down its custom-template branch, which
# derives the output name by stripping .j2 and uses changelog_file only to
# locate the *previous* changelog - so changelog_file stopped naming the
# output. A release-notes-only override is exempt and would be safe. The
# custom template that lived there also iterated a `versions` variable that
# python-semantic-release does not bind, so every render since 1.0.0 produced
# the literal "# Changelog" and nothing else. The built-in templates honour
# changelog_file, produce actual content, and are maintained upstream.
[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.rc]
match = "rc"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"
